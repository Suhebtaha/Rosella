name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q Rosella.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android project
        working-directory: Rosella
        run: flutter create --platforms=android --org com.suhaib --project-name dreams_tracker .

      - name: Remove default test
        working-directory: Rosella
        run: rm -rf test

      - name: Patch android
        working-directory: Rosella
        run: python3 tool/patch_android.py

      - name: Install dependencies
        working-directory: Rosella
        run: flutter pub get

      - name: Build release APK
        working-directory: Rosella
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: Rosella-apk
          path: Rosella/build/app/outputs/flutter-apk/*.apk
