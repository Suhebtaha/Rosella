name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q Rosella.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android project
        working-directory: Rosella
        run: flutter create --platforms=android --org com.suhaib --project-name dreams_tracker .

      - name: Remove default test
        working-directory: Rosella
        run: rm -rf test

      - name: Patch android
        working-directory: Rosella
        run: python3 tool/patch_android.py

      - name: Install dependencies
        working-directory: Rosella
        run: flutter pub get

      - name: Build release APK
        working-directory: Rosella
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: flutter build apk --release --dart-define=GEMINI_KEY=$GEMINI_KEY

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Rosella/build/app/outputs/flutter-apk/app-release.apk Rosella.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Rosella.apk --title "Rosella" --notes "Latest build"
