name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unpack uploaded zip (if any)
        run: |
          for z in *.zip; do
            [ -f "$z" ] || continue
            rm -rf /tmp/unz && mkdir -p /tmp/unz
            unzip -qo "$z" -d /tmp/unz
            src=$(find /tmp/unz -maxdepth 3 -name pubspec.yaml -printf '%h\n' | head -1)
            if [ -n "$src" ]; then
              cp -a "$src"/. .
              echo "Unpacked $z"
            fi
            break
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key (from secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > tool/rosella.jks

      - name: Generate android project
        run: flutter create --platforms=android --org com.suhaib --project-name dreams_tracker .

      - name: Patch android (permissions, biometrics, minSdk)
        run: python3 tool/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Remove default test (not part of the app)
        run: rm -rf test

      - name: Analyze (informational)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=GEMINI_KEY=${{ secrets.GEMINI_KEY }}
          --dart-define=CF_ACCOUNT=${{ secrets.CF_ACCOUNT }}
          --dart-define=CF_TOKEN=${{ secrets.CF_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: Rosella-apk
          path: build/app/outputs/flutter-apk/*.apk
