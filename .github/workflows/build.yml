name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unpack uploaded zip (if any)
        run: |
          for z in *.zip; do
            [ -f "$z" ] || continue
            rm -rf /tmp/unz && mkdir -p /tmp/unz
            unzip -qo "$z" -d /tmp/unz
            src=$(find /tmp/unz -maxdepth 3 -name pubspec.yaml -printf '%h\n' | head -1)
            if [ -n "$src" ]; then
              cp -a "$src"/. .
              echo "Unpacked $z"
            fi
            break
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android project
        run: flutter create --platforms=android --org com.suhaib --project-name dreams_tracker .

      - name: Patch android (permissions, biometrics, minSdk)
        run: python3 tool/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: dreams-tracker-apk
          path: build/app/outputs/flutter-apk/*.apk
