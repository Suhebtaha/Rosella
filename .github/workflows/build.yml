name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the newest uploaded zip (highest app version)
        run: |
          best=""; bestv="0"
          for z in *.zip; do
            [ -f "$z" ] || continue
            v=$(unzip -p "$z" '*pubspec.yaml' 2>/dev/null | grep -m1 '^version:' | sed 's/version: *//; s/+.*//')
            [ -n "$v" ] || continue
            if [ "$(printf '%s\n%s\n' "$bestv" "$v" | sort -V | tail -1)" = "$v" ]; then best="$z"; bestv="$v"; fi
          done
          if [ -n "$best" ]; then
            rm -rf /tmp/unz && mkdir -p /tmp/unz
            unzip -qo "$best" -d /tmp/unz
            src=$(find /tmp/unz -maxdepth 3 -name pubspec.yaml -printf '%h\n' | head -1)
            [ -n "$src" ] && cp -a "$src"/. . && echo "Unpacked $best (version $bestv)"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key (from secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > tool/rosella.jks

      - name: Generate android project
        run: flutter create --platforms=android --org com.suhaib --project-name dreams_tracker .

      - name: Patch android (permissions, biometrics, minSdk)
        run: python3 tool/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Remove default test (not part of the app)
        run: rm -rf test

      - name: Analyze (informational)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: >
          flutter build apk --release --target-platform android-arm64
          --dart-define=GEMINI_KEY=${{ secrets.GEMINI_KEY }}
          --dart-define=CF_ACCOUNT=${{ secrets.CF_ACCOUNT }}
          --dart-define=CF_TOKEN=${{ secrets.CF_TOKEN }}
          --dart-define=ELEVEN_KEY=${{ secrets.ELEVEN_KEY }}

      - name: Publish release (one ready-to-install APK)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          TAG="v$VER"
          cp build/app/outputs/flutter-apk/app-release.apk "Rosella-$VER.apk"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "Rosella-$VER.apk" \
            --title "Rosella $VER" \
            --notes "Download Rosella-$VER.apk below and install it."
